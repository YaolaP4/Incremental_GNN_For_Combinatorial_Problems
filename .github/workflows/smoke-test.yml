name: regression-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Show resolved environment
        run: |
          python - <<'PY'
          import platform
          import torch, torch_geometric, numpy, scipy, networkx
          print('Python:', platform.python_version())
          for name, lib in [('torch', torch), ('torch_geometric', torch_geometric), ('numpy', numpy), ('scipy', scipy), ('networkx', networkx)]:
              print(f'{name}: {lib.__version__}')
          PY
      - name: Syntax and import
        run: |
          python -m py_compile dynamic_gnn.py tests/test_dynamic_gnn.py
          python -c "import dynamic_gnn"
      - name: Regression suite
        run: python -m unittest discover -s tests -v
